allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 35
                defaultConfig {
                    minSdkVersion 21
                    targetSdkVersion 35
                }
            }
        }
        
        // Solución para la propiedad 'flutter' faltante en wakelock_plus
        if (!project.extensions.extraProperties.has("flutter")) {
            project.extensions.extraProperties.set("flutter", [getSdkPath: { -> "" }])
        }
    }
}
