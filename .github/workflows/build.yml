name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Parchear versión de wakelock_plus dentro del paquete Flet
        run: |
          python -c '
          import flet, os
          flet_path = os.path.dirname(flet.__file__)
          print("Buscando en:", flet_path)
          for root, dirs, files in os.walk(flet_path):
              for file in files:
                  if file.endswith((".yaml", ".yml", ".json", ".gradle")):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          if "wakelock_plus" in content or "1.4.0" in content:
                              new_content = content.replace("1.4.0", "1.8.2")
                              if new_content != content:
                                  with open(filepath, "w", encoding="utf-8") as f:
                                      f.write(new_content)
                                  print(f"Parcheado exitosamente: {filepath}")
                      except Exception:
                          pass
          '

      - name: Construir APK de Flet Definitivo
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
