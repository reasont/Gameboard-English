name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Destruir la versión 1.4.0 de wakelock_plus y parchear el sistema
        run: |
          # Borramos por completo la carpeta conflictiva de la caché para que no pueda ser utilizada
          rm -rf ~/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0
          
          # Creamos un directorio falso o vacío y le inyectamos un build.gradle totalmente compatible con SDK 35
          mkdir -p ~/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android
          
          cat << 'EOF' > ~/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle
          group 'com.example.wakelock_plus'
          version '1.4.0'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              compileSdkVersion 35
              namespace 'com.example.wakelock_plus'
              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 35
              }
          }
          EOF

      - name: Construir APK de Flet Definitivo
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
