name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Construir APK de Flet (Primera ejecución para generar estructura)
        run: |
          flet build apk --verbose || true

      - name: Parchear directorios de Gradle y caché de wakelock_plus
        run: |
          # 1. Parchear el build.gradle global de la caché externa si existe
          TARGET_GRADLE="/home/runner/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            echo "Inyectando propiedades en wakelock_plus..."
            echo "" >> "$TARGET_GRADLE"
            echo "afterEvaluate { project ->" >> "$TARGET_GRADLE"
            echo "    if (project.hasProperty('android')) {" >> "$TARGET_GRADLE"
            echo "        project.android {" >> "$TARGET_GRADLE"
            echo "            compileSdkVersion 35" >> "$TARGET_GRADLE"
            echo "            defaultConfig { minSdkVersion 21 targetSdkVersion 35 }" >> "$TARGET_GRADLE"
            echo "        }" >> "$TARGET_GRADLE"
            echo "    }" >> "$TARGET_GRADLE"
            echo "}" >> "$TARGET_GRADLE"
          fi

          # 2. Inyectar init.gradle robusto para interceptar cualquier subproyecto
          mkdir -p ~/.gradle
          echo "allprojects {
              afterEvaluate { project ->
                  if (project.name == 'wakelock_plus') {
                      project.extensions.extraProperties.set('flutter', [getSdkPath: { -> '/usr/local/lib/android/sdk' }])
                      if (project.hasProperty('android')) {
                          project.android {
                              compileSdkVersion 35
                              defaultConfig {
                                  minSdkVersion 21
                                  targetSdkVersion 35
                              }
                          }
                      }
                  }
              }
          }" > ~/.gradle/init.gradle

      - name: Construir APK de Flet Final
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
