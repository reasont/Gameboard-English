name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Construir APK de Flet (Primera pasada para descargar dependencias)
        run: |
          flet build apk --verbose || true

      - name: Parchear wakelock_plus forzosamente en caché
        run: |
          TARGET_GRADLE="/home/runner/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            echo "¡Archivo encontrado! Aplicando parche de compilación a wakelock_plus..."
            echo "" >> "$TARGET_GRADLE"
            echo "afterEvaluate { project ->" >> "$TARGET_GRADLE"
            echo "    if (project.hasProperty('android')) {" >> "$TARGET_GRADLE"
            echo "        project.android {" >> "$TARGET_GRADLE"
            echo "            compileSdkVersion 35" >> "$TARGET_GRADLE"
            echo "            defaultConfig { minSdkVersion 21 targetSdkVersion 35 }" >> "$TARGET_GRADLE"
            echo "        }" >> "$TARGET_GRADLE"
            echo "    }" >> "$TARGET_GRADLE"
            echo "}" >> "$TARGET_GRADLE"
          else
            echo "Error: No se encontró el archivo build.gradle de wakelock_plus"
            exit 1
          fi

      - name: Construir APK de Flet Definitivo
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
