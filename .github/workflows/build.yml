name: Compilar APK con Flutter Nativo
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet y Serious Python
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0 serious-python

      - name: Forzar dependencias limpias en pubspec.yaml
        run: |
          # Aseguramos que la versión de wakelock_plus sea la moderna y compatible con SDK 35
          cat << 'EOF' > pubspec.yaml
          name: gameboard_english
          description: A Flet-based English study app.
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flet: ^0.23.2
            wakelock_plus: ^1.8.2
            package_info_plus: ^8.1.0

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF

      - name: Crear estructura nativa de Flutter para la app de Python
        run: |
          # Inicializamos el soporte de Flutter en el proyecto actual
          flutter create . --org com.flet --project-name gameboard_english --platforms android
          
          # Empaquetamos el código de Python usando serious-python dentro de los assets
          mkdir -p assets
          python -m serious_python.main package . --output assets/app.zip

      - name: Aceptar licencias de Android y compilar APK
        run: |
          yes | flutter doctor --android-licenses || true
          flutter build apk --release --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
