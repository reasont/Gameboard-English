name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Construir APK de Flet (Primera pasada para generar la plantilla temporal)
        run: |
          flet build apk --verbose || true

      - name: Parchear dinámicamente la plantilla temporal y la caché de wakelock_plus
        run: |
          # 1. Buscar y parchear cualquier archivo build.gradle dentro de directorios temporales de flet_flutter_build
          find /tmp -name "build.gradle" 2>/dev/null | while read -r file; do
            if grep -q "allprojects" "$file" || grep -q "subprojects" "$file"; then
              echo "Parcheando archivo principal de Gradle: $file"
              echo "" >> "$file"
              echo "subprojects {" >> "$file"
              echo "    afterEvaluate { project ->" >> "$file"
              echo "        if (project.name == 'wakelock_plus') {" >> "$file"
              echo "            project.extensions.extraProperties.set('flutter', [getSdkPath: { -> '/usr/local/lib/android/sdk' }])" >> "$file"
              echo "        }" >> "$file"
              echo "        if (project.hasProperty('android')) {" >> "$file"
              echo "            project.android {" >> "$file"
              echo "                compileSdkVersion 35" >> "$file"
              echo "                defaultConfig { minSdkVersion 21 targetSdkVersion 35 }" >> "$file"
              echo "            }" >> "$file"
              echo "        }" >> "$file"
              echo "    }" >> "$file"
              echo "}" >> "$file"
            fi
          done

          # 2. Parchear también el build.gradle específico de wakelock_plus en la caché global si existe
          TARGET_GRADLE="/home/runner/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            echo "Parcheando caché de wakelock_plus..."
            echo "" >> "$TARGET_GRADLE"
            echo "afterEvaluate { project ->" >> "$TARGET_GRADLE"
            echo "    if (project.hasProperty('android')) {" >> "$target_gradle"
            echo "        project.android {" >> "$TARGET_GRADLE"
            echo "            compileSdkVersion 35" >> "$TARGET_GRADLE"
            echo "            defaultConfig { minSdkVersion 21 targetSdkVersion 35 }" >> "$TARGET_GRADLE"
            echo "        }" >> "$TARGET_GRADLE"
            echo "    }" >> "$TARGET_GRADLE"
            echo "}" >> "$TARGET_GRADLE"
          fi

      - name: Construir APK de Flet Definitivo
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
