allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 35
                defaultConfig {
                    minSdkVersion 21
                    targetSdkVersion 35
                }
            }
        }
        
        // Parche definitivo para el error de 'extension android type LibraryExtension' en wakelock_plus
        try {
            if (project.name == "wakelock_plus") {
                project.extensions.extraProperties.set("flutter", [
                    getSdkPath: { -> "/usr/local/lib/android/sdk" }
                ])
            }
        } catch (Exception e) {
            // Ignorar si ya está definida
        }
    }
}
