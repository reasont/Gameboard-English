name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Parchear wakelock_plus en caché
        run: |
          TARGET_GRADLE="/home/runner/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            echo "Parcheando build.gradle de wakelock_plus..."
            echo -e "\nafterEvaluate { project ->\n    if (project.hasProperty('android')) {\n        project.android {\n            compileSdkVersion 35\n            defaultConfig { minSdkVersion 21 targetSdkVersion 35 }\n        }\n    }\n}" >> "$TARGET_GRADLE"
          else
            echo "El archivo se parcheará después de resolver dependencias."
          fi

      - name: Construir APK de Flet
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
