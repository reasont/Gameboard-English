name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Forzar versión limpia de wakelock_plus antes de compilar
        run: |
          mkdir -p ~/.pub-cache
          # Modificamos el pubspec_overrides.yaml para obligar a usar una versión moderna
          echo "dependency_overrides:" > pubspec_overrides.yaml
          echo "  wakelock_plus: ^1.8.2" >> pubspec_overrides.yaml
          echo "  package_info_plus: ^8.1.0" >> pubspec_overrides.yaml

      - name: Construir APK de Flet Definitivo
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
