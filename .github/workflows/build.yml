name: Compilar APK con Flet
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.0

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Construir APK de Flet (Primera pasada para generar la plantilla temporal)
        run: |
          flet build apk --verbose || true

      - name: Parchear dinámicamente los build.gradle temporales
        run: |
          find /tmp -name "build.gradle" 2>/dev/null | while read -r file; do
            if grep -q "allprojects" "$file" || grep -q "subprojects" "$file"; then
              echo "Parcheando archivo temporal de Gradle: $file"
              echo "" >> "$file"
              echo "subprojects {" >> "$file"
              echo "    afterEvaluate { project ->" >> "$file"
              echo "        if (project.name == 'wakelock_plus') {" >> "$file"
              echo "            project.extensions.extraProperties.set('flutter', [getSdkPath: { -> '/usr/local/lib/android/sdk' }])" >> "$file"
              echo "        }" >> "$file"
              echo "        if (project.hasProperty('android')) {" >> "$file"
              echo "            project.android {" >> "$file"
              echo "                compileSdkVersion 35" >> "$file"
              echo "                defaultConfig { minSdkVersion 21 targetSdkVersion 35 }" >> "$file"
              echo "            }" >> "$file"
              echo "        }" >> "$file"
              echo "    }" >> "$file"
              echo "}" >> "$file"
            fi
          done

      - name: Construir APK de Flet Definitivo
        run: |
          flet build apk --verbose

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
